name: Check external links

# Course material points at things other people maintain: tutorials, videos,
# distribution home pages. Those move and disappear without telling us, so this
# checks them on a schedule rather than waiting for a student to hit a 404.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'lessons/locales/en_english/**'
      - 'docs/index.html'
      - 'README.md'
      - 'tools/check_links.py'
      - '.github/workflows/check-links.yml'
  pull_request:
    paths:
      - 'lessons/locales/en_english/**'
      - 'docs/index.html'
      - 'README.md'

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check links
        id: check
        run: |
          set -o pipefail
          python3 tools/check_links.py | tee link-report.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo '### External link check'
            echo
            echo '```'
            cat link-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A scheduled run has nobody watching it, so a failure needs to become
      # something visible. Pushes and pull requests already show a red tick.
      - name: Open an issue if scheduled run found broken links
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('link-report.txt', 'utf8');
            const title = 'Broken external links in course material';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });
            const body = [
              'The scheduled link check found links that no longer resolve.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links'],
              });
            }
