name: Build site

# Everything under docs/, including the command index, is generated from the
# lesson markdown. Rather than relying on whoever edits a lesson to remember to
# run tools/build.py, this does it for them:
#
#   push to main  - rebuild and commit the result, so the published site and the
#                   command index always match the lessons
#   pull request  - only check, and fail if the generated files are stale, so a
#                   contributor sees it before merge

on:
  push:
    branches: [main]
    paths:
      - 'lessons/locales/en_english/**'
      - 'templates/**'
      - 'tools/**'
      - 'src/convert.py'
  pull_request:
    paths:
      - 'lessons/locales/en_english/**'
      - 'templates/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # the commit this job makes must not trigger the job again
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the converter
        run: pip install --quiet markdown-server==0.1.4 beautifulsoup4==4.11.1 jinja2

      - name: Check the generated files are up to date
        if: github.event_name == 'pull_request'
        run: python3 tools/build.py --check

      - name: Rebuild
        if: github.event_name != 'pull_request'
        run: python3 tools/build.py

      - name: Commit anything that changed
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files were already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Rebuild generated pages

          Regenerated from the lesson markdown by tools/build.py.
          Triggered by ${{ github.sha }}."
          git push
